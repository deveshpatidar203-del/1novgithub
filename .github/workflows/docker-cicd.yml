
name: Docker CI-CD Pipelines

on:
  push:
    branches:
      - master

jobs:
  build-push-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/myapp:latest .

      - name: Push Image to Docker Hub
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/myapp:latest

      - name: Pull Same Image
        run: |
          docker pull ${{ vars.DOCKERHUB_USERNAME }}/myapp:latest

      - name: Stop Old Container
        run: |
          docker rm -f myapp-container || true

      - name: Launch Container
        run: |
          docker run -d \
            --name myapp-container \
            -p 8080:80 \
            ${{ vars.DOCKERHUB_USERNAME }}/myapp:latest

